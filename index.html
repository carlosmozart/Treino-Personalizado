<body class="bg-slate-950 text-slate-100 font-sans pb-12 min-h-screen">

  <div id="toast" class="fixed top-6 right-6 bg-gradient-to-r from-emerald-600 to-teal-500 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 z-50 border border-emerald-400 transition-all duration-300 opacity-0 pointer-events-none transform translate-y-2">
    <svg class="w-5 h-5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
    </svg>
    <span class="font-bold">Log copiado! Pronto para envio.</span>
  </div>

  <header class="bg-slate-900 border-b border-slate-800 py-5 px-4 md:px-8 shadow-lg sticky top-0 z-40">
    <div class="max-w-3xl mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 p-2.5 rounded-xl text-slate-950 shadow-lg shadow-blue-500/20">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-black uppercase tracking-wider text-white">Treino Personalizado</h1>
          <p class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Hipertrofia e Emagrecimento</p>
        </div>
      </div>

      <div class="relative min-w-[240px]">
        <span class="absolute -top-2 left-3 bg-slate-900 px-2 text-[9px] font-black text-blue-400 uppercase tracking-widest z-10">Selecionar Rota</span>
        <select id="workoutSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none cursor-pointer">
          <option value="SEG">Segunda: Push A (Peito/Ombro/Tríceps)</option>
          <option value="TER">Terça: Pull A (Costas/Bíceps)</option>
          <option value="QUA">Quarta: Legs A (Joelho-Friendly)</option>
          <option value="QUI">Quinta: Push B (Peito/Ombro/Tríceps)</option>
          <option value="SEX">Sexta: Pull B (Costas/Bíceps/Core)</option>

        </select>
        <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 mt-6 space-y-6">

    <section class="bg-gradient-to-br from-slate-900 to-slate-950 rounded-2xl p-6 border border-slate-800 shadow-xl relative overflow-hidden">
      <div class="relative z-10">
        <h2 id="workoutName" class="text-2xl font-black text-white mt-3">Carregando...</h2>
        <p id="workoutFocus" class="text-slate-400 text-sm mt-1.5 flex items-center font-medium">
          Preparando base de dados
        </p>

        <div class="mt-5 pt-4 border-t border-slate-800/80 grid grid-cols-3 gap-2 text-center text-[10px] sm:text-xs">
          <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
            <span class="block font-bold text-slate-500 uppercase tracking-widest mb-0.5">Alerta Vermelho</span>
            <span class="text-rose-400 font-extrabold text-sm">< 8 Reps</span>
          </div>
          <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
            <span class="block font-bold text-slate-500 uppercase tracking-widest mb-0.5">Zona Segura</span>
            <span class="text-blue-400 font-extrabold text-sm">8-10 Reps</span>
          </div>
          <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
            <span class="block font-bold text-slate-500 uppercase tracking-widest mb-0.5">Subir Carga</span>
            <span class="text-emerald-400 font-extrabold text-sm">> 11 Reps</span>
          </div>
        </div>
      </div>
    </section>

    <section class="bg-slate-900 rounded-2xl p-5 border border-slate-800 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-xs font-black uppercase tracking-widest text-slate-400">Check-in Semanal</h3>
        <span id="streakLabel" class="text-[10px] font-black text-emerald-400 uppercase tracking-wider bg-emerald-950/40 border border-emerald-800/60 px-2.5 py-1 rounded-full">0 treinos este mês</span>
      </div>
      <!-- Ajustado para grid-cols-4, assim 7 dias quebram em 4 na primeira linha e 3 na segunda -->
      <div id="checkinGrid" class="grid grid-cols-4 gap-2"></div>
    </section>

    <section id="exercisesContainer" class="space-y-4"></section>

    <section class="space-y-4 pt-4">
      <button id="btnGenerate" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-extrabold text-lg py-4 rounded-2xl shadow-xl shadow-blue-950/20 transition-all duration-150 flex items-center justify-center space-x-2 border border-blue-500/20 active:scale-[0.99]">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span>Compilar Diário de Bordo</span>
      </button>

      <div id="reportContainer" class="hidden bg-slate-900 p-6 rounded-2xl border border-slate-800 transition-all duration-200 space-y-4">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800">
          <div class="flex items-center space-x-2">
            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h3 class="font-extrabold text-slate-200 text-sm md:text-base">Logs da Extração:</h3>
          </div>
          <button id="btnCopy" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center space-x-2 transition-all active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
            </svg>
            <span>Copiar Logs</span>
          </button>
        </div>
        <textarea id="reportOutput" readonly class="w-full h-44 bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-300 font-mono text-xs md:text-sm resize-none focus:outline-none"></textarea>
      </div>
    </section>
  </main>

  <script>
    const WORKOUT_DATABASE = {
      SEG: {
        name: "Segunda: Push A (Peito ênfase inferior, Ombro, Tríceps)",
        focus: "Tensão Mecânica e Cadeia de Empurrar",
        exercises: [
          { id: 'seg_1', name: 'Supino Declinado (Máquina)', targetSets: 4, targetReps: 9, targetWeight: 40, alt: 'Sem máquina declinada? Use Mergulho/Dips inclinando o tronco à frente, ou Flexão de braço com pés elevados. Ambos priorizam peitoral inferior.' },
          { id: 'seg_2', name: 'Crossover Polia Alta (de cima p/ baixo)', targetSets: 3, targetReps: 12, targetWeight: 15, alt: 'Foco em peitoral inferior: puxe as polias de cima para baixo, cruzando na frente do quadril.' },
          { id: 'seg_3', name: 'Desenvolvimento Máquina', targetSets: 3, targetReps: 10, targetWeight: 30 },
          { id: 'seg_4', name: 'Tríceps Pulley (Corda)', targetSets: 3, targetReps: 10, targetWeight: 30 }
        ]
      },
      TER: {
        name: "Terça: Pull A (Costas, Bíceps)",
        focus: "Espessura Dorsal e Cadeia de Puxar",
        exercises: [
          { id: 'ter_1', name: 'Puxada Frontal (Polia)', targetSets: 4, targetReps: 10, targetWeight: 55 },
          { id: 'ter_2', name: 'Remada Baixa (Polia)', targetSets: 3, targetReps: 10, targetWeight: 50 },
          { id: 'ter_3', name: 'Rosca Direta (Polia Baixa)', targetSets: 3, targetReps: 10, targetWeight: 25 },
          { id: 'ter_4', name: 'Rosca Martelo (Halteres)', targetSets: 3, targetReps: 10, targetWeight: 14 }
        ]
      },
      QUA: {
        name: "Quarta: Legs A (Adaptado ao Joelho)",
        focus: "Cadeia Posterior e Amplitude Protegida",
        exercises: [
          { id: 'qua_1', name: 'Leg Press 45º (Amplitude Parcial)', targetSets: 3, targetReps: 12, targetWeight: 120, alt: 'Não desça além de ~90° no joelho. Carga moderada, foco em controle, sem travar.' },
          { id: 'qua_2', name: 'Mesa/Cadeira Flexora', targetSets: 4, targetReps: 12, targetWeight: 35 },
          { id: 'qua_3', name: 'Elevação Pélvica (Hip Thrust)', targetSets: 3, targetReps: 12, targetWeight: 30, alt: 'Máquina disputada? Faça Ponte de Glúteo no chão com barra ou halter apoiado no quadril, ou Elevação Pélvica unilateral apoiando as costas no banco.' },
          { id: 'qua_4', name: 'Panturrilha (Leg Press ou em pé)', targetSets: 4, targetReps: 15, targetWeight: 80 }
        ]
      },
      QUI: {
        name: "Quinta: Push B (Peito, Ombro Lateral, Tríceps)",
        focus: "Blindagem Articular e Estabilidade",
        exercises: [
          { id: 'qui_1', name: 'Supino Articulado (Pegada Neutra)', targetSets: 4, targetReps: 9, targetWeight: 40 },
          { id: 'qui_2', name: 'Crossover Polia Alta (de cima p/ baixo)', targetSets: 3, targetReps: 12, targetWeight: 15, alt: 'Mesma execução de segunda: reforça peitoral inferior com um segundo estímulo na semana.' },
          { id: 'qui_3', name: 'Elevação Lateral (Halteres)', targetSets: 4, targetReps: 12, targetWeight: 10 },
          { id: 'qui_4', name: 'Tríceps Francês (Polia/Halter)', targetSets: 3, targetReps: 10, targetWeight: 20 }
        ]
      },
      SEX: {
        name: "Sexta: Pull B (Costas Espessura, Bíceps, Core)",
        focus: "Volume Direto e Encerramento da Semana",
        exercises: [
          { id: 'sex_1', name: 'Remada Cavalinho ou Máquina', targetSets: 4, targetReps: 10, targetWeight: 50 },
          { id: 'sex_2', name: 'Pulldown (Corda)', targetSets: 3, targetReps: 12, targetWeight: 30 },
          { id: 'sex_3', name: 'Rosca Scott Máquina', targetSets: 3, targetReps: 10, targetWeight: 25 },
          { id: 'sex_4', name: 'Abdominal (Prancha ou Máquina)', targetSets: 3, targetReps: 15, targetWeight: 20 }
        ]
      },
      SAB: {
        name: "Sábado: Legs B Leve + Lombar",
        focus: "Manutenção Protegida (dia da caminhada de 7km)",
        exercises: [
          { id: 'sab_1', name: 'Cadeira Extensora (Amplitude Parcial, Carga Leve)', targetSets: 3, targetReps: 12, targetWeight: 25, alt: 'Evite a extensão completa do joelho no topo do movimento. Se sentir dor, reduza a carga ou pule este exercício.' },
          { id: 'sab_2', name: 'Stiff/RDL (Halteres Leves)', targetSets: 3, targetReps: 12, targetWeight: 12 },
          { id: 'sab_3', name: 'Panturrilha Sentado (Máquina)', targetSets: 3, targetReps: 15, targetWeight: 70 },
          { id: 'sab_4', name: 'Extensão Lombar Leve (Banco Romano)', targetSets: 3, targetReps: 15, targetWeight: 0 }
        ]
      },
      DOM: {
        name: "Domingo: Treino Extra",
        focus: "Recuperação Ativa / Aeróbico ou Treino Livre",
        exercises: [
          { id: 'dom_1', name: 'Cardio / Esteira', targetSets: 1, targetReps: 30, targetWeight: 0, alt: '30 a 45 minutos de cardio em intensidade moderada.' },
          { id: 'dom_2', name: 'Abdominal Supra (Solo)', targetSets: 4, targetReps: 20, targetWeight: 0 },
          { id: 'dom_3', name: 'Prancha Isométrica', targetSets: 3, targetReps: 60, targetWeight: 0, alt: 'Mantenha o core contraído por 60 segundos ou até a falha técnica.' }
        ]
      }
    };

    let activeWorkoutKey = 'SEG';
    let formData = {};

    const workoutSelect = document.getElementById('workoutSelect');
    const workoutNameEl = document.getElementById('workoutName');
    const workoutFocusEl = document.getElementById('workoutFocus');
    const exercisesContainer = document.getElementById('exercisesContainer');
    const btnGenerate = document.getElementById('btnGenerate');
    const reportContainer = document.getElementById('reportContainer');
    const reportOutput = document.getElementById('reportOutput');
    const btnCopy = document.getElementById('btnCopy');
    const toast = document.getElementById('toast');
    const checkinGrid = document.getElementById('checkinGrid');
    const streakLabel = document.getElementById('streakLabel');

    // ---------- PERSISTÊNCIA (localStorage) ----------
    const HISTORY_KEY = 'treino_exercise_history';
    const CHECKIN_KEY = 'treino_checkins';
    const storageAvailable = (() => {
      try { const t = '__t__'; localStorage.setItem(t, '1'); localStorage.removeItem(t); return true; }
      catch (e) { return false; }
    })();

    function loadJSON(key) {
      if (!storageAvailable) return {};
      try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; }
    }
    function saveJSON(key, obj) {
      if (!storageAvailable) return;
      try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) { }
    }

    let exerciseHistory = loadJSON(HISTORY_KEY);
    let checkins = loadJSON(CHECKIN_KEY);

    function todayKey(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().slice(0, 10);
    }

    // ---------- CHECK-IN E CONTADOR MENSAL ----------
    const DAY_LABELS = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SAB'];
    
    function getSundayOfCurrentWeek() {
      const d = new Date();
      const day = d.getDay(); // 0 = domingo
      d.setDate(d.getDate() - day);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function renderCheckinGrid() {
      const sunday = getSundayOfCurrentWeek();
      const todayStr = todayKey();
      checkinGrid.innerHTML = '';
      
      // Loop para 7 dias da semana
      for (let i = 0; i < 7; i++) {
        const d = new Date(sunday);
        d.setDate(sunday.getDate() + i);
        const dateStr = d.toISOString().slice(0, 10);
        const checked = !!checkins[dateStr];
        const isToday = dateStr === todayStr;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = () => toggleCheckin(dateStr);
        btn.className = `flex flex-col items-center justify-center py-3 rounded-xl border transition-all duration-150 active:scale-95 ${
          checked
            ? 'bg-emerald-950/40 border-emerald-700 text-emerald-400'
            : isToday
              ? 'bg-blue-950/40 border-blue-700 text-blue-300'
              : 'bg-slate-950/50 border-slate-800 text-slate-500'
        }`;
        btn.innerHTML = `
          <span class="text-[9px] font-black uppercase tracking-wider">${DAY_LABELS[i]}</span>
          <span class="text-sm font-extrabold mt-1">${d.getDate()}</span>
          <span class="mt-1 text-base leading-none">${checked ? '✅' : isToday ? '⏳' : '—'}</span>
        `;
        checkinGrid.appendChild(btn);
      }
      updateMonthlyCounter();
    }

    function toggleCheckin(dateStr) {
      if (checkins[dateStr]) delete checkins[dateStr];
      else checkins[dateStr] = activeWorkoutKey;
      saveJSON(CHECKIN_KEY, checkins);
      renderCheckinGrid();
    }

    function updateMonthlyCounter() {
      const hoje = new Date();
      const mesAtual = hoje.getMonth();
      const anoAtual = hoje.getFullYear();
      let count = 0;
      
      for (const dateStr in checkins) {
        // Garantindo parsing correto da data ignorando fuso
        const d = new Date(dateStr + 'T00:00:00');
        if (d.getMonth() === mesAtual && d.getFullYear() === anoAtual) {
          count++;
        }
      }
      
      streakLabel.textContent = `${count} treino(s) neste mês`;
    }

    // ---------- MARCADOR PERSISTENTE ----------
    function getPersistentLoadBadge(exId) {
      const h = exerciseHistory[exId];
      if (!h) return '';
      const r = parseInt(h.reps, 10);
      if (isNaN(r) || r <= 10) return '';
      return `<div class="mb-3 text-amber-300 bg-amber-950/40 border border-amber-700/60 px-3 py-2 rounded-xl text-xs font-black flex items-center space-x-2">
        <span>📈 Última sessão (${h.date}): ${h.reps} reps com ${h.weight}kg. Hora de subir a carga!</span>
      </div>`;
    }

    function initializeWorkoutData(key) {
      activeWorkoutKey = key;
      const workout = WORKOUT_DATABASE[key];
      formData = {};
      workout.exercises.forEach(ex => {
        const saved = exerciseHistory[ex.id];
        formData[ex.id] = saved
          ? { name: ex.name, sets: saved.sets, reps: saved.reps, weight: saved.weight, obs: '' }
          : { name: ex.name, sets: ex.targetSets, reps: ex.targetReps, weight: ex.targetWeight, obs: '' };
      });
    }

    function renderHeader() {
      const workout = WORKOUT_DATABASE[activeWorkoutKey];
      workoutNameEl.textContent = workout.name;
      workoutFocusEl.innerHTML = `
        <svg class="w-4 h-4 mr-2 text-blue-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        ${workout.focus}
      `;
    }

    function getProgressionAlert(reps) {
      const r = parseInt(reps, 10);
      if (isNaN(r) || r <= 0) return '';
      if (r > 10) {
        return `<div class="mt-3 text-emerald-400 bg-emerald-950/40 border border-emerald-800/60 px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-2"><span>🔥 Torque sobrando! Suba a carga no próximo treino.</span></div>`;
      } else if (r >= 8) {
        return `<div class="mt-3 text-blue-400 bg-blue-950/40 border border-blue-800/60 px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-2"><span>⚖️ Base Sólida. Massa muscular blindada contra o déficit.</span></div>`;
      } else {
        return `<div class="mt-3 text-rose-400 bg-rose-950/40 border border-rose-800/60 px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-2"><span>⚠️ Risco de Catabolismo. Tente arrancar pelo menos 8 reps!</span></div>`;
      }
    }

    function renderExercises() {
      const workout = WORKOUT_DATABASE[activeWorkoutKey];
      exercisesContainer.innerHTML = '';

      workout.exercises.forEach(ex => {
        const state = formData[ex.id];
        const card = document.createElement('div');
        card.className = "bg-slate-900 rounded-2xl p-5 border border-slate-800/80 hover:border-slate-700/80 transition-all duration-200 shadow-sm";
        card.innerHTML = `
          <div class="mb-4">
            <div class="flex items-center space-x-3">
              <div class="bg-blue-950/50 text-blue-400 p-2.5 rounded-xl border border-blue-900/30">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" /></svg>
              </div>
              <div>
                <h3 class="font-extrabold text-base md:text-lg text-white leading-tight">${ex.name}</h3>
                <p class="text-xs text-slate-400 mt-0.5">Alvo base: <span class="text-slate-300 font-semibold">${ex.targetSets}x${ex.targetReps}</span> | <span class="text-blue-300 font-semibold">${ex.targetWeight} kg</span></p>
              </div>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div class="bg-slate-950/50 rounded-xl p-2.5 border border-slate-800 flex flex-col items-center">
              <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Séries</span>
              <div class="flex items-center space-x-4">
                <button type="button" onclick="adjustValue('${ex.id}', 'sets', -1)" class="bg-slate-850 hover:bg-slate-800 text-slate-300 p-2 rounded-lg border border-slate-700/50">-</button>
                <span id="display-sets-${ex.id}" class="text-lg font-extrabold text-white min-w-[24px] text-center">${state.sets}</span>
                <button type="button" onclick="adjustValue('${ex.id}', 'sets', 1)" class="bg-slate-850 hover:bg-slate-800 text-slate-300 p-2 rounded-lg border border-slate-700/50">+</button>
              </div>
            </div>
            <div class="bg-slate-950/50 rounded-xl p-2.5 border border-slate-800 flex flex-col items-center">
              <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Repetições</span>
              <div class="flex items-center space-x-4">
                <button type="button" onclick="adjustValue('${ex.id}', 'reps', -1)" class="bg-slate-850 hover:bg-slate-800 text-slate-300 p-2 rounded-lg border border-slate-700/50">-</button>
                <span id="display-reps-${ex.id}" class="text-xl font-black text-blue-400 min-w-[28px] text-center">${state.reps}</span>
                <button type="button" onclick="adjustValue('${ex.id}', 'reps', 1)" class="bg-slate-850 hover:bg-slate-800 text-slate-300 p-2 rounded-lg border border-slate-700/50">+</button>
              </div>
            </div>
            <div class="bg-slate-950/50 rounded-xl p-2.5 border border-slate-800 flex flex-col items-center">
              <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Carga (kg)</span>
              <div class="flex items-center space-x-2">
                <button type="button" onclick="adjustValue('${ex.id}', 'weight', -1)" class="bg-slate-850 hover:bg-slate-800 text-slate-300 p-1.5 rounded-lg border border-slate-700/50">-</button>
                <input type="number" id="input-weight-${ex.id}" value="${state.weight}" onchange="updateWeightDirectly('${ex.id}', this.value)" class="bg-transparent text-center font-extrabold text-white text-base w-12 focus:outline-none"/>
                <button type="button" onclick="adjustValue('${ex.id}', 'weight', 1)" class="bg-slate-850 hover:bg-slate-800 text-slate-300 p-1.5 rounded-lg border border-slate-700/50">+</button>
                <button type="button" onclick="adjustValue('${ex.id}', 'weight', 5)" class="bg-blue-900/40 hover:bg-blue-800/60 text-blue-400 px-1.5 py-1 text-[10px] font-black rounded ml-1 border border-blue-800/30">+5</button>
              </div>
            </div>
          </div>
          <div id="badge-container-${ex.id}">${getPersistentLoadBadge(ex.id)}</div>
          <div id="alert-container-${ex.id}">${getProgressionAlert(state.reps)}</div>
          ${ex.alt ? `<div class="mt-3 text-amber-300 bg-amber-950/30 border border-amber-800/40 px-3 py-2 rounded-xl text-xs font-medium flex items-start space-x-2"><span>💡</span><span>${ex.alt}</span></div>` : ''}
          <div class="mt-4">
            <input type="text" value="${state.obs}" placeholder="Notas de combate (Ex: Falha no manguito, base firme...)" oninput="updateObs('${ex.id}', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white text-xs focus:outline-none focus:ring-1 focus:ring-slate-700 placeholder-slate-600"/>
          </div>
        `;
        exercisesContainer.appendChild(card);
      });
    }

    window.adjustValue = function(exId, field, amount) {
      const state = formData[exId];
      if (!state) return;
      const currentValue = parseInt(state[field], 10) || 0;
      const newValue = Math.max(0, currentValue + amount);
      state[field] = newValue;
      
      if (field === 'sets') document.getElementById(`display-sets-${exId}`).textContent = newValue;
      else if (field === 'reps') {
        document.getElementById(`display-reps-${exId}`).textContent = newValue;
        document.getElementById(`alert-container-${exId}`).innerHTML = getProgressionAlert(newValue);
      } 
      else if (field === 'weight') document.getElementById(`input-weight-${exId}`).value = newValue;
    };

    window.updateWeightDirectly = function(exId, value) { if (formData[exId]) formData[exId].weight = Math.max(0, parseInt(value, 10) || 0); };
    window.updateObs = function(exId, value) { if (formData[exId]) formData[exId].obs = value; };

    btnGenerate.addEventListener('click', () => {
      const workout = WORKOUT_DATABASE[activeWorkoutKey];
      const today = todayKey();
      let report = `LOG DE EXTRAÇÃO | ${workout.name}\nFoco: ${workout.focus}\n---------------------------------------------\n`;
      workout.exercises.forEach(ex => {
        const state = formData[ex.id];
        if (state) {
          report += `> ${ex.name}: ${state.sets}x${state.reps} | ${state.weight}kg`;
          if (state.obs && state.obs.trim() !== '') report += ` [Nota: ${state.obs.trim()}]`;
          report += '\n';
          exerciseHistory[ex.id] = { sets: state.sets, reps: state.reps, weight: state.weight, date: today };
        }
      });
      saveJSON(HISTORY_KEY, exerciseHistory);

      checkins[today] = activeWorkoutKey;
      saveJSON(CHECKIN_KEY, checkins);
      renderCheckinGrid();
      renderExercises();

      reportOutput.value = report;
      reportContainer.classList.remove('hidden');
      reportContainer.scrollIntoView({ behavior: 'smooth' });
    });

    btnCopy.addEventListener('click', () => {
      reportOutput.select();
      reportOutput.setSelectionRange(0, 99999);
      try { if (document.execCommand('copy')) showToastNotification(); } 
      catch (err) { console.error('Falha ao copiar:', err); }
    });

    function showToastNotification() {
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
      }, 3500);
    }

    workoutSelect.addEventListener('change', (e) => {
      initializeWorkoutData(e.target.value);
      renderHeader();
      renderExercises();
      reportContainer.classList.add('hidden');
    });

    window.addEventListener('DOMContentLoaded', () => {
      if (!storageAvailable) {
        const warn = document.createElement('div');
        warn.className = 'max-w-3xl mx-auto px-4 mt-4';
        warn.innerHTML = `<div class="bg-rose-950/40 border border-rose-800/60 text-rose-300 text-xs font-bold px-4 py-3 rounded-xl">⚠️ Armazenamento local indisponível neste navegador/modo. Seu progresso não será salvo entre sessões.</div>`;
        document.querySelector('header').insertAdjacentElement('afterend', warn);
      }
      
      // Auto-selecionar o dia atual da semana
      const diaDaSemanaHoje = new Date().getDay(); // 0 = Domingo, 1 = Segunda...
      const chaveDia = DAY_LABELS[diaDaSemanaHoje];
      
      workoutSelect.value = chaveDia;
      initializeWorkoutData(chaveDia);
      renderHeader();
      renderExercises();
      renderCheckinGrid();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => { });
      });
    }
  </script>
</body>
</html>

name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Validar app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate contracts and unit tests
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test onboarding flow
        run: npm run test:smoke

name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Validar app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate contracts and unit tests
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test onboarding flow
        run: npm run test:smoke

  app:
    name: Validar app novo (app/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Configure Java (Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore security rules (emulator)
        run: npm run test:rules

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests on production build
        run: npm run test:e2e

  android:
    name: Compilar Android (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Sync web app
        run: npm run sync:android

      - name: Compile and unit test
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain

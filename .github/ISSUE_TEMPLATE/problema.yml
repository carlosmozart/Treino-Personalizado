name: Relatar um problema
description: Algo não funcionou como deveria no app.
title: "Problema: "
labels: ["problema"]
body:
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu?
      description: O que você fez, o que esperava e o que apareceu. Uma captura de tela ajuda.
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do app
      description: Vem preenchida quando o relato sai pelo app (Perfil → Relatar um problema).
  - type: input
    id: aparelho
    attributes:
      label: Aparelho
  - type: textarea
    id: registro
    attributes:
      label: Registro de erros
      description: Os últimos erros guardados no aparelho, se houver. Só aparece aqui; nada é enviado sem você publicar.
      render: text

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <script>
      // tema salvo, aplicado antes do app carregar (ver src/ui/theme.ts)
      try {
        var t = localStorage.getItem('tp-theme');
        var light = t === 'light' || (t !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f4f5');
        var accent = localStorage.getItem('tp-accent');
        if (accent && /^#[0-9a-f]{6}$/i.test(accent)) document.documentElement.style.setProperty('--color-primary', accent);
      } catch (e) {}
    </script>
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Meu Treino" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Treino Personalizado</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
